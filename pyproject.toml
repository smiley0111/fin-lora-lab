[project]
name = "fin-lora-lab"
version = "0.1.0"
description = "金融文本任务上的 LoRA 微调实验：小模型微调 vs 大模型提示词，用同一套评测比较"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "dodu" }]

dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "modelscope>=1.20",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finlora"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
